<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parla History</title>
    <script type="module" src="/src/history.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>History</h1>
        <div class="actions">
          <button id="refresh" type="button">Refresh</button>
          <button id="clear" type="button">Clear history…</button>
        </div>
      </header>
      <div id="confirm" class="confirm" hidden>
        <span>Clear all history? This cannot be undone.</span>
        <button id="confirm-clear" type="button" class="danger">Clear</button>
        <button id="cancel-clear" type="button">Cancel</button>
      </div>
      <p id="status" class="status" hidden></p>
      <p id="empty" class="status" hidden>No dictations recorded yet.</p>
      <table id="history" hidden>
        <thead>
          <tr>
            <th scope="col">Time</th>
            <th scope="col">Provider</th>
            <th scope="col">Audio</th>
            <th scope="col" title="Key-up to audio ready">Ready</th>
            <th scope="col" title="Audio ready to provider returned">Transcribe</th>
            <th scope="col" title="Provider returned to pasted">Paste</th>
            <th scope="col" title="Key-up to pasted">Total</th>
            <th scope="col">Transcript</th>
            <th scope="col">Error</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
  </body>
</html>
