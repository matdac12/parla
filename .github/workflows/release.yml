name: Release

# A v* tag builds the installer and the portable zip and publishes them as a
# GitHub Release. Anything else is a dry run: same build, uploaded as the
# parla-release artifact, nothing published. Dry runs start by hand (Actions ->
# Release -> Run workflow) or on a branch push that touches the release files.
on:
  push:
    tags: ['v*']
    branches: ['**']
    # Tag pushes ignore this filter.
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md
      - src-tauri/tauri.release.conf.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version matches the tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versions = [ordered]@{
            'src-tauri/tauri.conf.json' = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            'package.json' = (Get-Content package.json -Raw | ConvertFrom-Json).version
            'src-tauri/Cargo.toml' = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          }
          $version = $versions['src-tauri/tauri.conf.json']
          $versions.GetEnumerator() | ForEach-Object { "$($_.Key): $($_.Value)" }
          if (@($versions.Values | Select-Object -Unique).Count -ne 1) {
            throw 'Versions differ. Run: node scripts/set-version.mjs <version>'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Release-profile cache, apart from CI's (which builds no release). Saved
      # only by runs on main (Run workflow, or a merge touching the release
      # files); tag runs restore it, since tag-saved caches serve no other tag.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Relink ort's DLLs pruned by rust-cache
        shell: pwsh
        run: ./.github/scripts/relink-ort-dylibs.ps1
      - run: npm ci
      - run: npx tauri build --no-bundle
      # No DirectML.dll: build.rs delay-loads it and the CPU-only ONNX Runtime
      # never calls it. ONNX Runtime's C++ code does need MSVCP140*.dll, which
      # import VCRUNTIME140*.dll, so these ship app-local and Parla starts
      # without the VC++ Redistributable (PARLA-32).
      - name: Stage parla.exe and the VC++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'src-tauri/target/release-stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath 'src-tauri/target/release/parla.exe' -Destination $stage -Force
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'No Visual Studio with the x64 C++ tools found' }
          $version = (Get-Content (Join-Path $vs 'VC/Auxiliary/Build/Microsoft.VCRedistVersion.default.txt') -Raw).Trim()
          $crt = Get-ChildItem (Join-Path $vs "VC/Redist/MSVC/$version/x64") -Directory -Filter 'Microsoft.VC*.CRT' |
            Select-Object -First 1
          if (!$crt) { throw "No x64 CRT folder in VC++ redist $version" }
          "VC++ runtime $version from $($crt.FullName)"
          # Keep in sync with resources in tauri.release.conf.json.
          foreach ($name in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $dll = Join-Path $crt.FullName $name
            if (!(Test-Path -LiteralPath $dll -PathType Leaf)) { throw "Missing $dll" }
            Copy-Item -LiteralPath $dll -Destination $stage -Force
          }
          Get-ChildItem $stage | Format-Table Name, Length
      # Bundles the parla.exe built above; tauri.release.conf.json adds the
      # NSIS target and installs the VC++ runtime DLLs next to the executable.
      - run: npx tauri bundle --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Collect the installer, the portable zip and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'parla-release'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $setup = "Parla_${env:VERSION}_x64-setup.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/$setup" (Join-Path $out $setup)
          $zip = "Parla_${env:VERSION}_x64-portable.zip"
          Compress-Archive -Path 'src-tauri/target/release-stage/*' -DestinationPath (Join-Path $out $zip)
          $lines = Get-ChildItem $out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          # LF endings: CRLF makes `sha256sum -c` skip every line (PARLA-95).
          [IO.File]::WriteAllText((Join-Path $out 'SHA256SUMS.txt'), ($lines -join "`n") + "`n")
          Get-ChildItem $out | Format-Table Name, Length
          "OUT=$out" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: parla-release
          path: ${{ env.OUT }}
          if-no-files-found: error
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The published checksums must verify with sha256sum, as users run it.
          Push-Location $env:OUT
          $sums = & "$env:ProgramFiles/Git/bin/bash.exe" -c 'sha256sum --strict -c SHA256SUMS.txt'
          $code = $LASTEXITCODE
          Pop-Location
          $sums
          if ($code -ne 0 -or @($sums -match ': OK$').Count -ne 2) { throw 'SHA256SUMS.txt does not verify both files' }
          $dir = Join-Path $env:RUNNER_TEMP 'parla-installed'
          $setup = Join-Path $env:OUT "Parla_${env:VERSION}_x64-setup.exe"
          Start-Process $setup -ArgumentList '/S', "/D=$dir" -Wait
          Get-ChildItem $dir | Format-Table Name, Length
          $exe = Get-ChildItem $dir -Filter '*.exe' | Where-Object Name -ne 'uninstall.exe' | Select-Object -First 1
          if (!$exe) { throw 'The installer did not install the app executable' }
          if (Test-Path (Join-Path $dir 'DirectML.dll')) { throw 'The installer still ships DirectML.dll' }
          $runtime = @(Get-ChildItem 'src-tauri/target/release-stage' -Filter '*.dll' -File).Name
          if (!$runtime) { throw 'No VC++ runtime DLLs were staged' }
          foreach ($name in $runtime) {
            if (!(Test-Path (Join-Path $dir $name))) { throw "$name is not next to the executable" }
          }
          # A missing DLL kills the process at load; a healthy Parla sits in the tray.
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "Parla exited at startup with code $($app.ExitCode)" }
          try {
            # The runner has the VC++ Redistributable in System32; the app-local
            # copies must win, or a clean PC would still fail.
            $modules = (Get-Process -Id $app.Id).Modules
            # Get-Item expands 8.3 short names, which module paths may use.
            $installDir = (Get-Item -LiteralPath $exe.FullName).Directory.FullName
            foreach ($name in $runtime) {
              $module = $modules | Where-Object ModuleName -eq $name | Select-Object -First 1
              if (!$module) { throw "Parla did not load $name" }
              "$name <- $($module.FileName)"
              if ((Get-Item -LiteralPath $module.FileName).Directory.FullName -ne $installDir) {
                throw "$name was loaded from $($module.FileName), not from $installDir"
              }
            }
            # DirectML.dll is delay-loaded and must stay unloaded on the CPU path.
            $loaded = tasklist /m DirectML.dll /fi "PID eq $($app.Id)" /fo csv /nh |
              Select-String -SimpleMatch "`"$($app.Id)`""
            if ($loaded) { throw "Parla loaded DirectML.dll: $loaded" }
          } finally {
            Stop-Process -Id $app.Id -Force
          }
      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem $env:OUT -File).FullName `
            --verify-tag --title "Parla $env:VERSION" `
            --notes-file .github/release-notes.md --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
