name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Branch runs restore main's cache but skip the 2.5-6 min upload.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npx tauri build --no-bundle
      - name: Stage executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'src-tauri/target/release'
          $staging = Join-Path $env:RUNNER_TEMP 'parla-artifact'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          # transcribe-cpp links statically: parla.exe is the whole app.
          Copy-Item (Join-Path $release 'parla.exe') $staging
          # target/ may hold stale ONNX DLLs restored from main's cache, so check
          # what the executable actually imports instead of the folder contents.
          $dumpbin = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter dumpbin.exe |
            Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          $imports = & $dumpbin.FullName /nologo /dependents (Join-Path $staging 'parla.exe') | Out-String
          $imports
          if ($imports -match '(?i)onnxruntime|directml') { throw 'parla.exe still imports ONNX Runtime' }
          "parla.exe: {0:N1} MB" -f ((Get-Item (Join-Path $staging 'parla.exe')).Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: parla-windows-x64
          path: ${{ runner.temp }}/parla-artifact/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Branch runs restore main's cache but skip the 2.5-6 min upload.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npm ci && npm run build
