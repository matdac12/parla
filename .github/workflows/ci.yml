name: CI

# Lints and tests on Windows. The exe is built only by release.yml.
on:
  push:
    # Branches only: a v* tag runs release.yml instead.
    branches: ['**']
    tags-ignore: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE
      - .github/release-notes.md
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the branch's running CI. Each main run gets its own group,
# so main is never cancelled.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  # No debuginfo: smaller target dir and cache, faster links. Panics still print
  # file:line; only RUST_BACKTRACE frames lose line numbers.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The runner's preinstalled stable, which includes rustfmt and clippy.
      - name: Show toolchain
        run: |
          rustc --version
          cargo fmt --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Branch runs restore main's cache but skip the upload.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # ort-sys downloads ONNX Runtime here and watches DLL links into target/.
      # rust-cache neither caches this dir nor keeps the links, so without these
      # two steps every run reruns ort-sys and rebuilds ort -> transcribe-rs.
      # Saved on any branch, only on a miss: ~45 MB, once per Cargo.lock.
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Relink ort's DLLs pruned by rust-cache
        shell: pwsh
        run: ./.github/scripts/relink-ort-dylibs.ps1
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: npm ci && npm run build
      # clippy checks the deps (rmeta), test builds them; --all-targets gives
      # clippy the same dev-dependency features as test, so both share the
      # build scripts and proc macros, and the cache keeps both trees.
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
