name: CI

on:
  push:
    # research/** branches run only their own workflow (asr-bench.yml).
    branches-ignore: ['research/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Branch runs restore main's cache but skip the 2.5-6 min upload.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npx tauri build --no-bundle
      - name: Stage executable and materialize ONNX companion DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'src-tauri/target/release'
          $staging = Join-Path $env:RUNNER_TEMP 'parla-artifact'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $files = @((Get-Item (Join-Path $release 'parla.exe')))
          $files += @(Get-ChildItem -Path $release -Filter '*.dll' -File)
          foreach ($file in $files) {
            # ort may create symlinks on admin runners. Upload actual bytes.
            $source = $file.FullName
            if ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) {
              $source = $file.ResolveLinkTarget($true).FullName
            }
            $destination = Join-Path $staging $file.Name
            [IO.File]::Copy($source, $destination, $true)
            if ((Get-Item $destination).Attributes -band [IO.FileAttributes]::ReparsePoint) {
              throw "Artifact contains a link instead of a real file: $destination"
            }
          }
          $directml = Join-Path $staging 'DirectML.dll'
          if (!(Test-Path $directml -PathType Leaf) -or (Get-Item $directml).Length -le 1MB) {
            throw 'Artifact must contain a real DirectML.dll larger than 1 MB'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: parla-windows-x64
          path: ${{ runner.temp }}/parla-artifact/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Branch runs restore main's cache but skip the 2.5-6 min upload.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npm ci && npm run build
