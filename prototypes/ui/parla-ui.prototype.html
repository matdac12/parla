<title>PROTOTYPE · Parla UI touch-up (PARLA-57)</title>
<!--
  PROTOTYPE, throwaway (PARLA-57). Not production code: nothing here is bundled
  (vite.config.ts lists its own inputs) and nothing calls Tauri. All data is
  mocked in memory; reload to reset.

  Question: what should Parla look like when you open it? Tray menu, the app
  window (home + settings), the history / latency log, and the overlay pill.

  Plan: four directions on one page, switchable via ?variant=current|a|b|c,
  the arrow keys, or the floating bar at the bottom. "current" is a faithful
  copy of what ships today, as the baseline.

  Run: double-click this file, or open it in any Chromium browser.
-->
<style>

/* Windows-11 style toggle switch (used by B and C) */

/* ---------- stage ---------- */
.stage { display: flex; flex-wrap: wrap; gap: 28px; padding: 22px 24px 120px; justify-content: center; align-items: flex-start; }

.side { width: 400px; }
.screen { position: relative; border-radius: 10px; overflow: hidden; background: var(--wall); box-shadow: 0 0 0 1px rgba(0,0,0,0.1); }

.side-note { font-size: 12px; color: var(--desk-text); margin: 2px 0 0; line-height: 1.45; }

/* ---------- floating prototype switcher (deliberately not part of any design) ---------- */

.proto-bar button.sw-acc { width: 18px; height: 18px; padding: 0; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px #555; }

.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); z-index: 1001; background: #111; color: #fff; font: 13px system-ui; padding: 8px 14px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

/* ---------- overlay pill: copied from src/overlay.css, plus per-direction modifiers ---------- */
.ov { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.captions { box-sizing: border-box; width: 330px; padding: 9px 13px; border-radius: 11px; background: rgba(18,18,20,0.88);
  box-shadow: 0 0 0 0.5px rgba(255,255,255,0.1), 0 4px 13px rgba(0,0,0,0.17); font: 13px/19px "Segoe UI", sans-serif; text-align: left; }
.captions .st, .ccard .st { color: rgba(255,255,255,0.88); } .captions .pv, .ccard .pv { color: rgba(255,255,255,0.56); }
.pill { display: flex; align-items: center; justify-content: center; gap: 11px; width: 116px; height: 32px; border-radius: 16px;
  background: rgba(18,18,20,0.92); box-shadow: 0 0 0 0.5px rgba(255,255,255,0.14), 0 6px 18px rgba(0,0,0,0.35);
  position: relative; transition: width 220ms var(--ease), box-shadow 220ms var(--ease); }
.pill:not([data-phase="recording"]) { width: 40px; }
.pill[data-phase="error"] { width: 76px; }
.pill button { all: unset; display: none; place-items: center; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; }
.pill .retry { background: rgba(255,255,255,0.12); color: #fff; }
.pill[data-phase="error"] .retry, .pill[data-phase="done"] .r-ok, .pill[data-phase="error"] .r-err { display: grid; }
.pill .r-ok { color: #7ee2a8; margin: 0 -5px; } .pill .r-err { color: #ff8f8a; margin: 0 -5px; }
.pill:not([data-phase="recording"]) .mode, .pill:not([data-phase="recording"]) .bars, .pill:not([data-phase="processing"]) .spinner, .pill .timer, .pill .reason { display: none; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; animation: spin 700ms linear infinite; }
.mode { display: grid; place-items: center; width: 12px; height: 12px; color: #fff; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.85); }
.pill[data-locked="true"] .bar, .pill[data-locked="true"] .mode { color: #b9b6ff; }
.pill[data-locked="true"] .bar { background: #b9b6ff; }
.bars { display: flex; align-items: center; justify-content: space-between; width: 58px; height: 100%; }
.bar { width: 2.5px; height: 3px; border-radius: 2px; background: #fff; animation: lvl 900ms ease-in-out infinite alternate; }
.bar:nth-child(1) { animation-delay: -100ms; } .bar:nth-child(2) { animation-delay: -420ms; } .bar:nth-child(3) { animation-delay: -250ms; }
.bar:nth-child(4) { animation-delay: -700ms; } .bar:nth-child(5) { animation-delay: -60ms; } .bar:nth-child(6) { animation-delay: -520ms; }
.bar:nth-child(7) { animation-delay: -330ms; } .bar:nth-child(8) { animation-delay: -800ms; } .bar:nth-child(9) { animation-delay: -180ms; }
@keyframes lvl { 0% { height: 3px; opacity: 0.4; } 60% { height: 13px; opacity: 1; } 100% { height: 7px; opacity: 0.75; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* B: elapsed timer while locked; a short reason chip above a failed pill */
.pv-b .timer { font: 600 11px/1 "Segoe UI", sans-serif; color: #b9b6ff; font-variant-numeric: tabular-nums; }
.pv-b[data-phase="recording"][data-locked="true"] { width: 132px; gap: 8px; }
.pv-b[data-phase="recording"][data-locked="true"] .timer { display: block; }
.pv-b[data-phase="recording"][data-locked="true"] .bars { width: 46px; }
.pv-b[data-phase="recording"][data-locked="true"] .bar:nth-child(n+8) { display: none; }
.reason-chip { font: 12px/1 "Segoe UI", sans-serif; color: #ffd0cd; background: rgba(18,18,20,0.88); padding: 6px 10px; border-radius: 8px;
  box-shadow: 0 0 0 0.5px rgba(255,255,255,0.1); }

/* C: one surface. Mode is a ring, not a tint; captions grow out of the pill itself */
.pv-c { width: 96px; gap: 0; }
.pv-c .mode { display: none !important; }
.pv-c .bars { width: 64px; }
.pv-c[data-locked="true"] { box-shadow: 0 0 0 2px #b9b6ff, 0 6px 18px rgba(0,0,0,0.35); }
.pv-c[data-locked="true"] .bar { background: #fff; }
.pv-c[data-phase="done"] { box-shadow: 0 0 0 2px #7ee2a8, 0 6px 18px rgba(0,0,0,0.35); }
.pv-c[data-phase="error"] { box-shadow: 0 0 0 2px #ff8f8a, 0 6px 18px rgba(0,0,0,0.35); }
.ccard { width: 330px; border-radius: 16px; background: rgba(18,18,20,0.92); box-shadow: 0 0 0 0.5px rgba(255,255,255,0.14), 0 6px 18px rgba(0,0,0,0.35);
  padding: 10px 14px 0; display: flex; flex-direction: column; align-items: center; font: 13px/19px "Segoe UI", sans-serif; }
.ccard .txt { align-self: stretch; text-align: left; }
.ccard .pill { box-shadow: none; background: transparent; }

@media (prefers-reduced-motion: reduce) { .bar { animation: none; height: 8px; } }

/* =================== CURRENT (baseline, copied from app.css / settings.css / history.css) =================== */

function aHistory() {

function aTimings() {
  const done = RECORDS.filter(ok);

  const med = totals[Math.floor(totals.length / 2)];
  const scale = Math.max(...totals);
  return `<div class="a-page wide"><h1>Timings</h1><p class="lede">Key-up to pasted, per dictation. Replaces the separate latency-log window.</p>
    <div class="tiles"><div class="tile"><div class="v">${med}<small>ms</small></div><div class="l">median, key-up → pasted</div></div><div class="tile"><div class="v">${totals[0]}<small>ms</small></div><div class="l">fastest</div></div><div class="tile"><div class="v">${totals[totals.length - 1]}<small>ms</small></div><div class="l">slowest that succeeded</div></div></div>
    ${legend()}
    <div class="tchart">${RECORDS.map((r) => `<div class="trow"><span class="who">${clock(r.at)} · ${PNAME[r.provider]}</span>${ok(r) ? track(r, scale) : `<span class="fail">Failed after ${(r.t[1] / 1000).toFixed(1)} s · ${esc(r.error)}</span>`}<span class="tot">${ok(r) ? total(r) + " ms" : "—"}</span></div>`).join("")}</div>
    <details style="margin-top:14px"><summary class="muted" style="cursor:pointer">Table view</summary>${curLatency().replace(/<header>.*?<\/header>/s, "")}</details></div>`;
}
function aSettings(v) {

    "s-transcription": ["Transcription", "Which engine turns your voice into text. Switching applies right away.", `<section class="card"><h2>Provider</h2>${providerRadios()}</section><section class="card"><h2>${PNAME[S.provider]}</h2>${providerConfig()}</section>`],
    "s-dictation": ["Dictation & hotkey", "How you start, lock and stop a dictation, and what you see while talking.", `<section class="card"><h2>Hotkey</h2>${hotkeyField()}</section><section class="card"><h2>While I speak</h2>${check("streaming", "Transcribe while I speak", "Cloud streams as you talk; the local model transcribes each phrase at your pauses.")}${check("captions", "Show live captions above the recording bar", "Two-line preview; your text box is untouched until the paste.")}</section>`],
    "s-audio": ["Other audio", "Music and calls while you dictate.", `<section class="card">${check("dim", "Dim other audio while dictating", "Apps play quieter, then return to their volume. Nothing is paused.")}${num("dimLevel", "Their volume while dictating (%)", "10–90 %. 30 % sounds about half as loud.", 10, 90, 10)}</section>`],

  const list = shown();

  const items = byDay(list).map((g) => `<div class="day">${g.day}</div>${g.items.map((r) => `<div class="c-li ${r.id === sel.id ? "on" : ""} ${ok(r) ? "" : "failed"}" data-action="select" data-id="${r.id}"><div class="l1"><span>${clock(r.at)}</span><span class="p">${PNAME[r.provider]}</span></div><div class="l2">${textOf(r)}</div></div>`).join("")}`).join("");
  const scale = total(sel);
  const detail = ok(sel)
    ? `<div class="bd-title">Where the ${total(sel)} ms went</div><div class="bd">${track(sel, scale)}</div><div class="bd-labels">${STAGES.map(([k, n], i) => `<span><i class="s-${k}"></i>${n} ${sel.t[i]} ms</span>`).join("")}</div>`
    : `<div class="bd-title">What happened</div><p class="muted" style="margin:0">Audio was ready after ${sel.t[0]} ms; ${PNAME[sel.provider]} did not answer within 15 s. The clip is kept, so Retry sends it again.</p>`;
  return `<div class="c-md"><div class="c-list"><div class="srch"><input id="q" type="search" placeholder="Search" value="${esc(S.q)}"/></div>${items || '<p class="muted" style="padding:0 14px">No match.</p>'}</div>
    <div class="c-detail"><div class="when">${full(sel.at)}</div><div class="big ${ok(sel) ? "" : "err"}">${textOf(sel)}</div>
      <div class="acts">${ok(sel) ? copyBtn(sel, "primary") : retryBtn(sel, "primary")}${ok(sel) ? "" : '<button type="button">Dismiss</button>'}</div>
      <div class="kv"><div><b>${PNAME[sel.provider]}</b><small>provider</small></div><div><b>${sel.audio.toFixed(1)} s</b><small>audio</small></div><div><b>${ok(sel) ? words(sel.text) : "—"}</b><small>words</small></div><div><b>${ok(sel) ? total(sel) + " ms" : "—"}</b><small>key-up → pasted</small></div></div>
      ${detail}</div></div>`;
}

function cSettings() {

  return `<div class="c-grid">
    <div class="c-card"><h3>Transcription</h3><div class="c-segp">${PROVIDERS.map((p) => `<button type="button" class="c-tab ${S.provider === p.id ? "on" : ""}" data-action="provider" data-id="${p.id}">${p.short}</button>`).join("")}</div>${models}</div>
    <div class="c-card"><h3>Hotkey</h3>${r("Talk / hands-free", `<span>${S.capturing ? "<span class='muted'>Press keys…</span>" : kbd(S.hotkey)}</span>`)}<div class="r"><span class="muted" style="font-size:0.8rem">Hold modifiers to talk, tap all to lock, Esc cancels.</span><button type="button" class="small" data-action="capture">${S.capturing ? "Cancel" : "Change"}</button></div></div>
    <div class="c-card"><h3>While dictating</h3>${r("Transcribe while I speak", sw("streaming"))}${r("Live captions", sw("captions"))}${r("Dim other audio", sw("dim"))}${S.dim ? r("Their volume", `<input type="number" id="c-dimLevel" data-bind="dimLevel" min="10" max="90" step="10" value="${S.dimLevel}"/>`, "10–90 %") : ""}</div>
    <div class="c-card"><h3>Paste</h3>${r("Compatibility mode", sw("compat"), "for apps that miss pasted text")}${r("Restore clipboard after", `<input type="number" id="c-delay" data-bind="delay" min="50" max="2000" step="50" value="${S.delay}"/>`, "ms")}</div>
    <div class="c-card span2"><h3>Vocabulary</h3><textarea id="c-vocab" data-bind="vocab" spellcheck="false">${esc(S.vocab)}</textarea><p class="hint">One per line. Hints for cloud models; never rewrites your text. ${Date.now() - S.savedAt < 1500 ? '<span class="status-success">✓ Saved</span>' : "Saves as you type."}</p></div>
  </div>`;
}

// ---------------------------------------------------------------- render
const zoomFit = () => Math.min(1, (innerWidth - 48) / 900);
function render() {
  const focus = document.activeElement && document.activeElement.id ? { id: document.activeElement.id, a: document.activeElement.selectionStart, b: document.activeElement.selectionEnd } : null;
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.dataset.accent = S.accent;
  document.getElementById("accents").innerHTML = ACCENTS.map((a) => `<button type="button" class="sw-acc ${S.accent === a.key ? "on" : ""}" data-accent="${a.key}" title="${a.name}" style="--c:${a.swatch}"></button>`).join("") + `<span class="accname">${ACCENTS.find((a) => a.key === S.accent).name}</span>`;
  const view = { current: vCurrent, a: vA, mix: vA, b: vB, c: vC }[S.variant]();
  const chips = S.variant === "current"
    ? `<div class="wchips"><button type="button" class="wchip ${S.view.current !== "latency" ? "on" : ""}" data-action="view" data-view="home">Parla · app.html</button><button type="button" class="wchip ${S.view.current === "latency" ? "on" : ""}" data-action="view" data-view="latency">Parla History · history.html</button></div>`
    : `<div class="wchips"><span class="wchip on">Parla · one window</span></div>`;
  document.getElementById("root").innerHTML = `<div class="stage" style="--zoom:${zoomFit()}">
    <div class="col"><p class="panel-title">App window <span class="sub">— 900 × 680, as opened from the tray</span></p>${chips}
      <div class="win"><div class="titlebar"><span class="appico"></span>${view.title}<span class="caps"><span>—</span><span>☐</span><span>✕</span></span></div><div class="win-body">${view.body}</div></div></div>
    ${trayPanel()}${pillPanel()}</div>`;
  const v = theVariant();
  document.getElementById("vlabel").innerHTML = `<b>${VARIANTS.indexOf(v) + 1}/${VARIANTS.length} · ${v.key.toUpperCase()}</b> (${v.name})<small>${v.idea}</small>`;
  if (focus) {
    const el = document.getElementById(focus.id);
    if (el) { el.focus(); try { el.setSelectionRange(focus.a, focus.b); } catch { /* not a text input */ } }
  }
}

// ---------------------------------------------------------------- interaction
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.hidden = true), 1800);
}
const usesSaveButton = () => ["current", "a", "mix"].includes(S.variant);
function changed() {
  if (usesSaveButton()) { S.dirty = true; S.savedMsg = ""; }
  else { S.savedAt = Date.now(); setTimeout(render, 1600); }
}
function setVariant(key) {
  S.variant = key; S.pop = false; S.q = ""; S.filter = "all";
  const u = new URL(location.href); u.searchParams.set("variant", key); history.replaceState(null, "", u);
  render();
}
function cycle(step) { const i = VARIANTS.findIndex((v) => v.key === S.variant); setVariant(VARIANTS[(i + step + VARIANTS.length) % VARIANTS.length].key); }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  if (a === "view") { S.view[S.variant] = el.dataset.view; S.q = ""; S.filter = "all"; }
  else if (a === "cview") { S.view.c = el.dataset.view; }
  else if (a === "copy") { S.copied = id; setTimeout(() => { S.copied = null; render(); }, 1400); }
  else if (a === "retry") {
    S.retrying = true;
    setTimeout(() => { const f = newestFailed(); if (f) { f.text = "Per la demo di venerdì serve il build firmato, non quello di debug."; f.error = null; f.t = [44, 287, 31]; } S.retrying = false; render(); }, 1100);
  }
  else if (a === "dismiss") S.dismissed = true;
  else if (a === "provider") { S.provider = id; S.pop = false; toast(`Switched to ${PNAME[id]} (applies at once)`); }
  else if (a === "model") { if (!MODELS.find((m) => m.id === id).ok) return; S.model = id; S.pop = false; }
  else if (a === "download") {
    e.preventDefault(); S.dl = { id, pct: 0 };
    const tick = setInterval(() => { S.dl.pct += 10; if (S.dl.pct >= 100) { clearInterval(tick); MODELS.find((m) => m.id === id).ok = true; S.dl = null; } render(); }, 180);
  }
  else if (a === "capture") {
    S.capturing = !S.capturing;
    if (S.capturing) setTimeout(() => { if (S.capturing) { S.capturing = false; S.hotkey = "Ctrl+Shift+F9"; changed(); render(); } }, 1600);
  }
  else if (a === "save") { S.dirty = false; S.savedMsg = "Saved"; setTimeout(() => { S.savedMsg = ""; render(); }, 1600); }
  else if (a === "discard") { S.dirty = false; }
  else if (a === "sheet") { S.sheet = !S.sheet; S.pop = false; }
  else if (a === "pop") S.pop = !S.pop;
  else if (a === "timings") S.timings = !S.timings;
  else if (a === "filter") S.filter = el.dataset.f;
  else if (a === "select") S.selected = id;
  else if (a === "tray") S.tray = el.dataset.mode;
  else if (a === "flip") { S[el.dataset.key] = !S[el.dataset.key]; }
  else if (a === "note") { toast(el.dataset.note); return; }
  render();
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.key && el.type === "checkbox") { S[el.dataset.key] = el.checked; changed(); render(); }
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "q") { S.q = el.value; render(); return; }
  // Re-rendering mid-drag would drop the slider; update its readout in place.
  if (el.type === "range") { S[el.dataset.bind] = Number(el.value); el.nextElementSibling.textContent = `${el.value} %`; S.savedAt = Date.now(); return; }
  if (el.dataset.bind) { S[el.dataset.bind] = el.type === "number" || el.type === "range" ? Number(el.value) : el.value; changed(); render(); }
});
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t.closest && (t.closest("input, textarea, select, [contenteditable]"))) return;
  if (e.key === "ArrowLeft") cycle(-1);
  else if (e.key === "ArrowRight") cycle(1);
  else if (e.key === "Escape" && (S.sheet || S.pop)) { S.sheet = false; S.pop = false; render(); }
});
document.addEventListener("mouseover", (e) => {
  const tip = document.getElementById("tip"); const seg = e.target.closest("[data-tip]");
  if (!seg) { tip.hidden = true; return; }
  tip.textContent = seg.dataset.tip; tip.hidden = false;
  const r = seg.getBoundingClientRect(); tip.style.left = `${r.left}px`; tip.style.top = `${r.top - 34}px`;
});
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.getElementById("accents").onclick = (e) => {
  const b = e.target.closest("[data-accent]"); if (!b) return;
  S.accent = b.dataset.accent;
  const u = new URL(location.href); u.searchParams.set("accent", S.accent); history.replaceState(null, "", u);
  render();
};
document.getElementById("theme").onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; render(); };
addEventListener("resize", render);
render();
</script>
</body>
</html>
