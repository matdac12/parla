[package]
name = "parla"
version = "0.1.0"
description = "Fast push-to-talk dictation for Windows"
edition = "2021"

[lib]
name = "parla_lib"
# Desktop only (no mobile entry point). staticlib/cdylib made every build write
# a 0.4-1.5 GB parla_lib.lib and link an extra full parla_lib.dll (PARLA-23).
crate-type = ["rlib"]
# No doc examples in the crate; skips an empty rustdoc pass on every `cargo test`.
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
native-smoke = []

[dependencies]
anyhow = "1"
# GGUF/ggml speech-to-text, CPU only and statically linked: no runtime DLLs.
# Handy moved every model to it (2026-10-14) and dropped ONNX Runtime.
transcribe-cpp = { version = "=0.4.0", default-features = false }
tempfile = "3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
cpal = "0.18"
hound = "3.5"
ringbuf = "0.5"
rubato = "5.0"
# Tauri defaults minus "compression": the ~90 KB frontend does not need brotli.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Threading"] }
enigo = "0.6.1"
arboard = { version = "3", default-features = false }
# Already in the tree via wry; used to lower the hidden overlay's memory target.
webview2-com = "0.39"
windows-core = "0.62"
