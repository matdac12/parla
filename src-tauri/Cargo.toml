[package]
name = "parla"
version = "0.1.0"
description = "Fast push-to-talk dictation for Windows"
edition = "2021"

[lib]
name = "parla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
transcribe-rs = { git = "https://github.com/cjpais/transcribe-rs", rev = "abc6f582967c40839c1d05ec5acc98d1068d9d58", default-features = false, features = ["onnx"] }
# transcribe-rs uses the rc.12 API; prerelease caret ranges otherwise select incompatible rc.14.
ort = "=2.0.0-rc.12"
ort-sys = "=2.0.0-rc.12"
tempfile = "3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
cpal = "0.18"
hound = "3.5"
ringbuf = "0.5"
rubato = "5.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
enigo = "0.6.1"
arboard = { version = "3", default-features = false }
