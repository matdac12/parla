[package]
name = "parla"
version = "0.1.1"
description = "Fast push-to-talk dictation for Windows"
edition = "2021"

[lib]
name = "parla_lib"
# Desktop only (no mobile entry point). staticlib/cdylib made every build write
# a 0.4-1.5 GB parla_lib.lib and link an extra full parla_lib.dll (PARLA-23).
crate-type = ["rlib"]
# No doc examples in the crate; skips an empty rustdoc pass on every `cargo test`.
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
native-smoke = []

[dependencies]
anyhow = "1"
transcribe-rs = { git = "https://github.com/cjpais/transcribe-rs", rev = "abc6f582967c40839c1d05ec5acc98d1068d9d58", default-features = false, features = ["onnx"] }
# transcribe-rs uses the rc.12 API; prerelease caret ranges otherwise select incompatible rc.14.
ort = "=2.0.0-rc.12"
ort-sys = "=2.0.0-rc.12"
tempfile = "3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
cpal = "0.18"
hound = "3.5"
ringbuf = "0.5"
rubato = "5.0"
# Tauri defaults minus "compression": the ~90 KB frontend does not need brotli.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Time"] }
enigo = "0.6.1"
arboard = { version = "3", default-features = false }
# Already in the tree via wry; used to lower the hidden overlay's memory target.
webview2-com = "0.39"
windows-core = "0.62"
# Same 0.62 as cpal, wry and tao, with features they already enable: other
# apps' audio session volumes (PARLA-42), the taskbar's edge (PARLA-60),
# and UI Automation for the editable probe (PARLA-79).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[[example]]
name = "compare_models"
# Run its WER and number-spelling unit tests with `cargo test`.
test = true
