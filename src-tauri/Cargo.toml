[package]
name = "parla"
version = "0.1.0"
description = "Fast push-to-talk dictation for Windows"
edition = "2021"

[lib]
name = "parla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
cpal = "0.18"
hound = "3.5"
ringbuf = "0.5"
rubato = "5.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
enigo = "0.6.1"
arboard = { version = "3", default-features = false }
