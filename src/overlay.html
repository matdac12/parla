<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Parla Recording</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <div class="overlay-root">
      <section class="card" id="card" aria-label="Not pasted" hidden>
        <div class="card-head">
          <span class="card-tag"><i></i><span></span></span>
          <svg class="card-ring" viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><circle class="track" cx="7" cy="7" r="5"/><circle class="arc" cx="7" cy="7" r="5"/></svg>
          <span class="card-header"></span>
          <button type="button" class="card-close" data-action="dismiss" title="Dismiss" aria-label="Dismiss">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4.8 4.8l6.4 6.4M11.2 4.8l-6.4 6.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
          </button>
        </div>
        <div class="card-body"></div>
        <div class="card-detail" hidden></div>
        <div class="card-foot"></div>
      </section>
      <div class="captions" id="captions" aria-label="Live transcription preview" hidden>
        <div class="caption-text"><span class="caption-stable"></span><span class="caption-provisional"></span></div>
      </div>
      <div class="pill" id="pill"></div>
    </div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
